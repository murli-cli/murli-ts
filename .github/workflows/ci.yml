name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to immutable commit SHAs (mutable tags are a supply-chain vector).
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        # version is taken from package.json -> packageManager (pnpm@9.7.1)
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Reproducible install. --frozen-lockfile fails if the lockfile drifts from
      # package.json; install scripts run only for pnpm.onlyBuiltDependencies.
      - run: pnpm install --frozen-lockfile

      # Fail the build on known advisories (moderate and above) across the whole tree.
      - run: pnpm audit --audit-level moderate

      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
