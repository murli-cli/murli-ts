name: Release

# Publishes @murli-cli/core and @murli-cli/commander to npm with build provenance
# when a v* tag is pushed. Requires:
#   - repository secret NPM_TOKEN (granular automation token, publish scope)
#   - the package.json version matching the tag
# Provenance is generated via GitHub OIDC (id-token: write) + publishConfig.provenance.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm build provenance (OIDC)
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile

      # Do not ship if a high+ advisory affects production dependencies.
      - run: pnpm audit --prod --audit-level high

      - run: pnpm build
      - run: pnpm test

      # pnpm publish rewrites `workspace:*` to the real version and honors
      # publishConfig.provenance per package. --no-git-checks because CI runs detached.
      - run: pnpm -r publish --access public --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
